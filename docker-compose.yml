version: '3.3'

services:
  mysql:
    image: mysql:8.0
    container_name: door-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DB:-door_access_system}
    ports:
      - "3307:3306"   #本机端口:容器端口(腾出3306给容器使用)
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:6
    container_name: door-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: door-mqtt
    restart: always
    ports:
      - "1883:1883"   # MQTT
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
    environment:
      - MOSQUITTO_CONFIG='listener 1883\nallow_anonymous true'

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: door-api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
      - mosquitto
    env_file: .env
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    volumes:
      - ./logs:/app/logs

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: door-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - fastapi

volumes:
  mysql-data:
  redis-data:
  mosquitto-data:
  mosquitto-logs: